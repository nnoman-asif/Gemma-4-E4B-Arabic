# Stage 2 Trust-Region Direct Preference Optimization (TR-DPO) for Gemma-4-26B-A4B-Arabic (MoE) on A100 80 GB
# Aligns the 128-expert Gemma-4-26B-A4B MoE on Saudi dialect and MSA preference pairs with router gates frozen.

model:
  base_model_id: "unsloth/gemma-4-26B-A4B-it"
  reference_model_id: "google/gemma-4-26B-A4B-it"
  hf_hub_repo_id: "noman-asif/Gemma-4-26B-A4B-Arabic-It"
  architecture_type: "moe"
  sft_adapter_dir: "outputs/sft_26b_a4b_stage1"
  max_seq_length: 2048
  dtype: "bfloat16"
  load_in_4bit: true

vram_optimization:
  target_vram_budget_gb: 80.0
  offload_ple_to_cpu: false
  offload_multimodal_towers_to_cpu: false
  multimodal_tower_patterns:
    - "vision_tower"
    - "embed_vision"
  restore_towers_before_export: false
  freeze_moe_router: true
  free_ref_model_vram: true
  ref_model: null
  precompute_ref_log_probs: false

lora:
  use_rslora: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  bias: "none"
  use_gradient_checkpointing: "unsloth"
  random_state: 3407
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  exclude_modules:
    - "vision_tower"
    - "multi_modal_projector"
    - "embed_vision"
    - "router"

dpo:
  beta: 0.1
  tr_alpha: 0.6
  tr_update_steps: 50
  loss_type: "sigmoid"
  max_length: 2048
  max_prompt_length: 1024
  max_completion_length: 1024
  label_smoothing: 0.0

training:
  output_dir: "outputs/dpo_26b_a4b_stage2"
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  optim: "adamw_bnb_8bit"
  learning_rate: 4.0e-7
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.10
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_train_epochs: 1
  bf16: true
  tf32: true
  fp16: false
  dataloader_pin_memory: true
  dataloader_num_workers: 4
  logging_steps: 20
  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 1
  eval_strategy: "steps"
  eval_steps: 200
  seed: 3407

datasets:
  total_target_pairs: 20000
  output_dataset_dir: "data/dpo_mixed"
  hf_hub_dataset_repo: "noman-asif/Arabic-Preference-DPO-20k"
