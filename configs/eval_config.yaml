# Standardized Before-and-After Benchmark Evaluation Configuration for the Gemma 4 Arabic Family
# Covers 7 primary Arabic/Saudi benchmarks (6 OALL v2 + MGSM-Ar CoT), 4 zero-forgetting anchors,
# and Iso-Active Latency/Throughput/VRAM profiling across Gemma-4-E4B-Arabic and Gemma-4-26B-A4B-Arabic.

evaluation:
  base_model_id: "unsloth/gemma-4-E4B-it-unsloth-bnb-4bit"
  sft_checkpoint_dir: "outputs/sft_stage1"
  dpo_checkpoint_dir: "outputs/dpo_stage2"
  merged_checkpoint_dir: "outputs/merged_gemma4_e4b_arabic/merged_16bit"
  output_report_path: "outputs/eval_reports/benchmark_comparison.md"
  output_json_path: "outputs/eval_reports/benchmark_results.json"
  family_comparison_json_path: "outputs/eval_reports/family_benchmark_comparison.json"
  batch_size: 4
  max_seq_length: 2048
  dtype: "bfloat16"
  device: "cuda:0"

models:
  e4b:
    label: "Gemma-4-E4B-Arabic-It"
    architecture: "Dense (8.0B Total / 4.5B Active)"
    base_model_id: "google/gemma-4-E4B-it"
    unsloth_model_id: "unsloth/gemma-4-E4B-it-unsloth-bnb-4bit"
    merged_checkpoint_dir: "outputs/merged_gemma4_e4b_arabic/merged_16bit"
    hf_repo_id: "noman-asif/Gemma-4-E4B-Arabic-It"
    device: "cuda:0"

  26b_a4b:
    label: "Gemma-4-26B-A4B-Arabic-It"
    architecture: "MoE 128 Experts (26.0B Total / 3.8B Active)"
    base_model_id: "google/gemma-4-26B-A4B-it"
    unsloth_model_id: "unsloth/gemma-4-26B-A4B-it"
    merged_checkpoint_dir: "outputs/merged_gemma4_26b_a4b_arabic/merged_16bit"
    hf_repo_id: "noman-asif/Gemma-4-26B-A4B-Arabic-It"
    device: "cuda:1"

retention_gate:
  enforce_zero_forgetting: true
  min_retention_ratio: 0.998
  max_allowed_drop_pct: 0.20
  default_ties_lambda: 0.85
  ties_density: 0.85
  sweep_lambdas_on_regression:
    - 0.80
    - 0.85
    - 0.90
    - 0.95
    - 1.00

arabic_benchmarks:
  ArabicMMLU:
    lm_eval_task: "arabicmmlu"
    lighteval_task: "community|arabic_mmlu:_average|0"
    metric: "acc_norm"
    num_fewshot: 0
    baseline_score: 55.2
    target_score: 64.5
    baseline_score_26b: 65.8
    target_score_26b: 75.4
    description: "Native 40-subject curriculum across KSA, Jordan, Egypt, and UAE (STEM, Islamic Studies, Arab Law, History, Civics)"

  MadinahQA:
    lm_eval_task: "arabicmmlu_arabic_language_general,arabicmmlu_arabic_language_grammar"
    lighteval_task: "community|madinah_qa:_average|0"
    metric: "acc_norm"
    num_fewshot: 0
    baseline_score: 44.1
    target_score: 64.0
    baseline_score_26b: 58.4
    target_score_26b: 74.2
    description: "Classical and MSA Arabic language and grammar (Nahw, Sarf, Irab, Balagha)"

  AlGhafa:
    lm_eval_task: "alghafa_native"
    lighteval_task: "community|alghafa:_average|0"
    metric: "acc_norm"
    num_fewshot: 0
    baseline_score: 54.2
    target_score: 68.0
    baseline_score_26b: 64.0
    target_score_26b: 76.8
    description: "Native MSA and Saudi/Gulf/Egyptian dialect reading comprehension, grounded QA, and sentiment"

  ACVA:
    lm_eval_task: "acva"
    lighteval_task: "community|acva:_average|0"
    metric: "acc_norm"
    num_fewshot: 0
    baseline_score: 72.0
    target_score: 82.0
    baseline_score_26b: 78.5
    target_score_26b: 88.2
    description: "Arabic and Islamic cultural values alignment across 58 native subtasks"

  EXAMS-AR:
    lm_eval_task: "exams_ar"
    lighteval_task: "community|arabic_exams|0"
    metric: "acc_norm"
    num_fewshot: 0
    baseline_score: 42.8
    target_score: 54.0
    baseline_score_26b: 54.6
    target_score_26b: 66.5
    description: "High-school subject examinations in Arabic across science and humanities"

  AraTrust:
    lm_eval_task: "aratrust"
    lighteval_task: "community|aratrust:_average|0"
    metric: "acc_norm"
    num_fewshot: 0
    baseline_score: 78.3
    target_score: 86.0
    baseline_score_26b: 83.5
    target_score_26b: 91.4
    description: "Arabic safety, truthfulness, and trustworthiness evaluation"

  MGSM-Ar:
    lm_eval_task: "mgsm_native_cot_ar"
    lighteval_task: "community|mgsm_ar|5"
    metric: "exact_match"
    num_fewshot: 5
    baseline_score: 51.6
    target_score: 66.8
    baseline_score_26b: 68.4
    target_score_26b: 81.2
    description: "Generative Arabic multi-step mathematical Chain-of-Thought (<|think|>) reasoning benchmark"

retention_anchors:
  MMLU-Pro:
    domain: "english_reasoning"
    lm_eval_task: "mmlu_pro"
    metric: "acc"
    num_fewshot: 5
    baseline_score: 69.4
    baseline_score_26b: 78.2
    max_regression_pct: 0.20
    min_acceptable_score: 69.2

  GSM8K:
    domain: "math_reasoning"
    lm_eval_task: "gsm8k"
    metric: "exact_match,strict-match"
    num_fewshot: 5
    baseline_score: 84.0
    baseline_score_26b: 91.4
    max_regression_pct: 0.20
    min_acceptable_score: 83.8

  HumanEval:
    domain: "code_generation"
    lm_eval_task: "humaneval"
    metric: "pass@1"
    num_fewshot: 0
    baseline_score: 52.0
    baseline_score_26b: 67.1
    max_regression_pct: 0.20
    min_acceptable_score: 51.8

  ARC-Challenge:
    domain: "english_science_anchor"
    lm_eval_task: "arc_challenge"
    metric: "acc_norm"
    num_fewshot: 25
    baseline_score: 76.6
    baseline_score_26b: 85.4
    max_regression_pct: 0.20
    min_acceptable_score: 76.4

latency_benchmark:
  context_lengths:
    - 512
    - 2048
    - 4096
  max_new_tokens: 128
  warmup_runs: 2
  timed_runs: 5
  output_json_path: "outputs/eval_reports/latency_vram_report.json"

vllm_concurrency_benchmark:
  hardware_target: "Single NVIDIA A100-SXM4-80GB (80.0 GB HBM2e, vLLM PagedAttention + Continuous Batching)"
  gpu_vram_limit_gb: 80.0
  gpu_memory_utilization: 0.90
  dtype: "bfloat16"
  prompt_tokens: 512
  max_new_tokens: 256
  concurrency_users:
    - 1
    - 10
    - 30
    - 40
    - 50
  output_json_path: "outputs/eval_reports/vllm_concurrency_profile.json"
  output_markdown_path: "outputs/eval_reports/vllm_concurrency_report.md"

plotting:
  output_dir: "assets/plots"
  dpi: 300
  formats:
    - "png"
    - "svg"
