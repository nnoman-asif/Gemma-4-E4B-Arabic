# Stage 1 Supervised Fine-Tuning (SFT) Configuration for Gemma-4-26B-A4B-Arabic (MoE) on A100 80 GB
# Optimized for Vast.ai A100 80 GB HBM2e (GPU 1 in Dual-Model Parallel Mode).
# Architecture: 26B Total Parameters, 128 Routed Experts, Top-8 Active (3.8B Active Parameters per Token).

model:
  base_model_id: "unsloth/gemma-4-26B-A4B-it"
  reference_model_id: "google/gemma-4-26B-A4B-it"
  hf_hub_repo_id: "noman-asif/Gemma-4-26B-A4B-Arabic-It"
  architecture_type: "moe"
  total_parameters: "26.0B"
  effective_parameters: "3.8B"
  num_experts: 128
  top_k_experts: 8
  vocab_size: 262144
  arabic_vocab_tokens: 8460
  max_seq_length: 2048
  dtype: "bfloat16"
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true

vram_optimization:
  target_vram_budget_gb: 80.0
  offload_ple_to_cpu: false
  offload_multimodal_towers_to_cpu: false
  multimodal_tower_patterns:
    - "vision_tower"
    - "embed_vision"
  restore_towers_before_export: false
  freeze_embeddings_and_lm_head: true
  freeze_moe_router: true

lora:
  use_rslora: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  bias: "none"
  use_gradient_checkpointing: false
  random_state: 3407
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  exclude_modules:
    - "vision_tower"
    - "multi_modal_projector"
    - "embed_vision"
    - "router"

training:
  output_dir: "outputs/sft_26b_a4b_stage1"
  per_device_train_batch_size: 5
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 6
  optim: "adamw_bnb_8bit"
  learning_rate: 8.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  neftune_noise_alpha: 5.0
  num_train_epochs: 2
  packing: true
  completion_only_loss: true
  bf16: true
  tf32: true
  fp16: false
  dataloader_pin_memory: true
  dataloader_num_workers: 4
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 800
  save_total_limit: 1
  eval_strategy: "steps"
  eval_steps: 800
  seed: 3407

chat_template:
  add_generation_prompt: false
  preserve_thinking_tokens: true
  default_enable_thinking: false
  empty_thinking_block: "<|think|>\n<|think|>\n"

datasets:
  total_target_samples: 120000
  arabic_mix_ratio: 0.75
  replay_mix_ratio: 0.25
  output_dataset_dir: "data/sft_mixed"
  hf_hub_dataset_repo: "noman-asif/Arabic-Reasoning-Instruct-120k"
