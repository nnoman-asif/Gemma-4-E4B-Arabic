[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-4-e4b-arabic"
version = "0.1.0"
description = "Gemma 4 E4B Arabic and Saudi dialect fine-tuning, Trust-Region DPO alignment, and zero-forgetting benchmark evaluation pipeline on an 8.0 GB GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Noman Asif" }
]
keywords = [
    "gemma-4",
    "arabic-llm",
    "saudi-dialect",
    "unsloth",
    "qlora",
    "rslora",
    "dpo",
    "ties-merging",
    "continual-learning"
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.0",
    "unsloth",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.26.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
eval = [
    "lm-eval>=0.4.5",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
build-sft-dataset = "scripts.build_sft_dataset:main"
build-dpo-dataset = "scripts.build_dpo_dataset:main"
train-sft = "src.train_sft:main"
train-dpo = "src.train_dpo:main"
merge-and-export = "src.merge_and_export:main"
run-benchmarks = "scripts.run_benchmarks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -q"
